# Website specifications
title: "SSCAD 2026" # Website's name
description: XXVII Simpósio em Sistemas Computacionais de Alto Desempenho (SSCAD 2026) da SBC
url: "https://sscad26.imd.ufrn.br" 
baseurl: "/" # Website's subpath (e.g.: /blog)
final_url: https://sscad26.imd.ufrn.br/
source_url: "https://github.com/NPAD-UFRN/sscad2026" 
encoding: UTF-8

# Website collections
collections_dir: collections
collections:
  news:
  keynote_speakers:
    sort_by: order
  travel_info:
    output: true

# Website SASS settings
sass:
  sass_dir: _sass
  style: compressed

# Jekyll plugins
plugins:
  - jekyll-seo-tag

exclude:
  - README.md
  - LICENSE
  - docker-compose.yml
  - .github
  - .gitignore
  - .devcontainer
  - .vscode
  - .dockerignore
  - vendor
  - scripts

social:
  instagram:
    url: "https://instagram.com/npad_ufrn"
    name: "Instagram"
    icon: "instagram.svg"
  linkedin:
    url: "https://www.linkedin.com/company/n%C3%BAcleo-de-processamento-de-alto-desempenho-npad"
    name: "LinkedIn"
    icon: "linkedin.svg"
