    - id: plenaria5
      type: keynote
      style: aud_ct
      url: '#plenaria5'
      title: Palestra plenária 5
      subtitle: Prof. Edson Borin
      authors: Edson Borin (Unicamp)
      room: Auditório do CT (216)
      keynote_title: Pilha de IA Brasileira - Oportunidades e Desafios
      abstract: |-
        Embora o país possua um mercado interno amplo e um grande volume de dados gerados por setores estratégicos e instituições como SUS, Embrapa e IBGE, temos o desafio de garantir a segurança dessas informações e a nossa soberania digital. Para isso, é fundamental entendermos a "Pilha de IA" — o conjunto de dados, infraestrutura computacional e software necessários para que os sistemas de IA funcionem — e discutirmos quais são os principais desafios tecnológicos a serem superados para atingirmos essa soberania.

        O objetivo do encontro é debater como nós podemos contribuir no processo de nacionalização incremental das camadas tecnológicas da pilha de IA, reduzindo a nossa dependência externa. Abordaremos de forma prática as barreiras que precisamos superar, como a carência de infraestrutura computacional de alto desempenho (HPC) e a dificuldade na retenção de talentos especializados. Por fim, discutiremos as oportunidades que temos para alavancar nossa capacidade científica através de institutos de pesquisa e modelos sustentáveis de financiamento.
      short_bio: |-
        Edson Borin é professor do Instituto de Computação da Universidade Estadual de Campinas (Unicamp). Antes de ingressar na Unicamp, foi pesquisador no Intel Labs, na Califórnia, onde trabalhou com técnicas avançadas de compilação e implantou em microprocessadores da Intel as técnicas de compressão de microcódigo que desenvolveu em seu doutorado. Desde 2010, na Unicamp, realiza pesquisa, desenvolvimento e ensino em diferentes níveis da pilha de software de sistemas computacionais. Sua experiência abrange desde a geração de código de baixo nível para sistemas operacionais e drivers, o escalonamento de código para arquiteturas paralelas e a adaptação de aplicações de HPC para a Nuvem Computacional, até o desenvolvimento de bibliotecas e ferramentas para treinamento de modelos de aprendizado profundo em larga escala.

        Atualmente, é coordenador do programa de pós-graduação do Instituto de Computação da Unicamp e do Laboratório Discovery, onde lidera projetos financiados por agências de fomento, empresas internacionais de tecnologia e grandes empresas brasileiras, e coordena a linha de representação de conhecimento do Hub de Inteligência Artificial e Arquiteturas Cognitivas, o H.IAAC. É autor de nove patentes, de dois livros (um sobre programação em linguagem de montagem e outro sobre computação de alto desempenho na nuvem) e de mais de 100 artigos científicos em conferências e periódicos internacionais. Já orientou mais de 40 pesquisadores de pós-doutorado, doutorado e mestrado, muitos dos quais premiados por suas teses e artigos.
