    - id: plenaria-lucia
      type: keynote
      style: aud_ct
      url: '#plenaria-lucia'
      title: Palestra plenária 3
      subtitle: Profª. Lúcia Drummond
      authors: Lúcia Drummond (UFF)
      room: Auditório do CT (216)
      keynote_title: "HPC/IA em Nuvens Computacionais: Desafios e Soluções"
      image: keynote_lucia_drummond.jpg
      abstract: |-
        Nesta palestra, apresentaremos estratégias inovadoras para otimizar o uso de infraestruturas de Computação de Alto Desempenho (HPC) e Inteligência Artificial (IA), com foco nos desafios financeiros e operacionais enfrentados por organizações ao decidir entre o processamento em ambientes locais (on-premises) e a migração para a nuvem.

        Para responder a essas questões, introduziremos a Wise-Burst, uma ferramenta de apoio à decisão que viabiliza o transbordo inteligente de cargas de trabalho (cloud bursting). Com base em análises do tempo de espera nas filas locais e estimativas de custos na nuvem, o sistema gera planos de execução otimizados, permitindo que gestores e usuários escolham a melhor estratégia de alocação de recursos.

        Apresentaremos também a Wise-Reserve, voltada para reservas inteligentes de GPUs na nuvem, otimizando o uso da capacidade dos blocos oferecidos pelos provedores e garantindo o cumprimento dos deadlines dos jobs. Por fim, discutiremos os resultados da Sim@Cloud, ferramenta que gerencia a execução de jobs de simulações científicas em máquinas virtuais de menor custo sujeitas a revogação (instâncias spot).
      short_bio: |-
        Lúcia Drummond é Professora Titular na Universidade Federal Fluminense (UFF) e Pesquisadora Nível B do CNPq, com Doutorado em Engenharia de Sistemas e Computação (COPPE-SISTEMAS, UFRJ, 1994). É especialista em Processamento de Alto Desempenho (HPC). Sua experiência inclui a participação no desenvolvimento do primeiro computador paralelo da COPPE/UFRJ e trabalhos focados em gerência de recursos em sistemas paralelos e distribuídos, como Cloud Computing. Possui mais de 100 publicações em periódicos e congressos de prestígio internacional. Tem orientado regularmente alunos de mestrado e doutorado. Também é editora associada do journal Future Generation Computer Systems da Elsevier e tem participado em comitês de programas, como coordenadora de trilhas e coordenadora de programas das principais conferências da área (Super Computing, SBAC-PAD, CCGrid, IPDPS, ISC etc.). Finalmente, tem coordenado projetos na área financiados pela FAPERJ, CNPq, CAPES e PETROBRAS.
