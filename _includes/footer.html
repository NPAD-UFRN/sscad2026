<div class="site-footer">
  <ul class="social-links">

    {% if site.social.instagram.url %}
    <li>
      <a href="{{ site.social.instagram.url }}" target="_blank" rel="noopener"
        aria-label="{{ site.social.instagram.name }}">
        {% include icons/{{ site.social.instagram.icon }} %}
      </a>
    </li>
    {% endif %}

    {% if site.social.linkedin.url %}
    <li>
      <a href="{{ site.social.linkedin.url }}" target="_blank" rel="noopener"
        aria-label="{{ site.social.linkedin.name }}">
        {% include icons/{{ site.social.linkedin.icon }} %}
      </a>
    </li>
    {% endif %}
  </ul>
  <div style="display: flex; flex-direction: column;">
    <p style="font-size: 1.25rem;">&copy; {{ site.title }}</p>
    <p>Todos os direitos reservados</p>
  </div>
</div>
