<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }} - {{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/geral.css' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}"> {% seo %}
    <link rel="icon" type="image/x-icon" href="{{ '/assets/img/favicon.ico' | relative_url }}">
</head>

<body>

    {% include nav.html %}

    <header class="text-center">
        <div class="container-fluid">
            <div id="sbc_logo">
                <a href="https://www.sbc.org.br/" target="_blank">
                    <span>Realização:</span>
                    <br>
                    <img src="{{ '/assets/img/sbc_white.png' | relative_url }}">
                </a>
            </div>
            <div class="row">
                <div class="col-md-8 offset-md-2 text-center">
                    <h1>{{site.title}}</h1>
                    <h2>
                        {{site.description}}
                    </h2>
                    <h3><span>3 a 5 de Novembro, 2026 — Natal, RN,
                            Brasil</span></h3>
                </div>
            </div>
        </div>
    </header>
    {{ content }}
    <footer style="text-align: center; padding-bottom: 0;">
        <div class="grid-container">
            <div class="sbc">
                <b>
                    <p>Realização</p>
                </b>
                <figure class="sbc">
                    <a href="https://www.sbc.org.br" target="_blank"><img
                            src="{{ '/assets/img/sbc_logo.png' | relative_url }}" class="img_prata"></a>
                    <img src="{{ '/assets/img/spacer.png' | relative_url }}" style="width: 5%;height: 1%;">
                    <a href="https://www2.sbc.org.br/ce-acpad/" target="_blank"><img id="ceacpad"
                            src="{{ '/assets/img/ceacpad.png' | relative_url }}" class="img_prata"></a>
                </figure>
            </div>
            <div class="org">
                <b>
                    <p>Organização</p>
                </b>
                <figure class="org-logos">
                    <div class="org-row">
                        <a href="https://www.ufrn.br" target="_blank">
                            <img src="{{ '/assets/img/logo/ufrn.png' | relative_url }}" class="img_diamante">
                        </a>
                        <a href="https://www.npad.ufrn.br" target="_blank">
                            <img src="{{ '/assets/img/logo/npad.png' | relative_url }}" class="img_diamante">
                        </a>
                    </div>
                    <div class="org-row">
                        <a href="https://www.uff.br" target="_blank">
                            <img src="{{ '/assets/img/logo/uff.png' | relative_url }}" class="img_diamante">
                        </a>
                    </div>
                </figure>
            </div>
            <div class="fomento">
                <b>
                    <p>Fomento</p>
                </b>
                <figure class="org">
                    <a href="https://gov.br/cnpq" target="_blank">
                        <img src="{{ '/assets/img/logo/cnpq.png' }}" class="img_diamante">
                    </a>
                    <!--<img src="{{ '/assets/img/spacer.png' | relative_url }}" style="width: 5%;height: 1%;">
						<a href="https://www.capes.gov.br" target="_blank"><img
                        src="{{ '/assets/img/capes.png' | relative_url }}"
                        class="img_diamante"></a>-->
                </figure>
            </div>
        </div>

        <!-- Seção de Patrocinadores - Design Fluido Sem Cards -->
        <div class="sponsors-section cardless-showcase">
            <div class="sponsors-header">
                <span class="sponsors-subtitle">Apoio e Parceria</span>
                <h2 class="sponsors-title">Patrocinadores</h2>
                <div class="sponsors-divider"></div>
            </div>

            <!-- Categoria Diamante -->
            <div class="sponsor-tier-group">
                <div class="tier-heading-row">
                    <span class="tier-heading-line"></span>
                    <div class="tier-pill tier-pill-diamante">
                        <svg class="tier-icon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
                            <path d="M12 2L2 9l10 13L22 9l-10-7zm0 2.8L18.4 9H5.6L12 4.8zM4.7 10.5h4.8L12 18.2 4.7 10.5zm6.8 0h5l-4.5 7.6-0.5-7.6zm6.8 0h1l-6.3 7.8 5.3-7.8z"/>
                        </svg>
                        <span>Diamante</span>
                    </div>
                    <span class="tier-heading-line"></span>
                </div>

                <div class="sponsors-showcase sponsors-showcase-diamante">
                    <a href="https://kaiak.ai/pt/index" target="_blank" rel="noopener noreferrer" class="sponsor-brand sponsor-brand-diamante" title="KAIAK - Patrocinador Diamante">
                        <img src="{{ '/assets/img/kaiak.png' | relative_url }}" alt="Logo KAIAK" class="sponsor-brand-img">
                    </a>

                    <a href="https://www.perfil.global/" target="_blank" rel="noopener noreferrer" class="sponsor-brand sponsor-brand-diamante" title="Perfil Comp / Dell Technologies / NVIDIA - Patrocinador Diamante">
                        <img src="{{ '/assets/img/logo/perfil-dell-nvidia.png' | relative_url }}" alt="Logo Perfil Computação / Dell Technologies / NVIDIA" class="sponsor-brand-img">
                    </a>
                </div>
            </div>

            <!-- Categoria Prata -->
            <div class="sponsor-tier-group">
                <div class="tier-heading-row">
                    <span class="tier-heading-line"></span>
                    <div class="tier-pill tier-pill-prata">
                        <svg class="tier-icon" viewBox="0 0 24 24" width="15" height="15" fill="currentColor">
                            <path d="M12 2L3 7v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V7l-9-5zm0 2.2l7 3.9v4.9c0 4.5-3.1 8.8-7 9.9-3.9-1.1-7-5.4-7-9.9V8.1l7-3.9z"/>
                        </svg>
                        <span>Prata</span>
                    </div>
                    <span class="tier-heading-line"></span>
                </div>

                <div class="sponsors-showcase sponsors-showcase-prata">
                    <a href="https://www.cesar.org.br/" target="_blank" rel="noopener noreferrer" class="sponsor-brand sponsor-brand-prata" title="CESAR - Patrocinador Prata">
                        <img src="{{ '/assets/img/logo/cesar.png' | relative_url }}" alt="Logo CESAR" class="sponsor-brand-img">
                    </a>
                </div>
            </div>
        </div>
        {% include footer.html %}

    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-w76AqPfDkMBDXo30jS1Sgez6pr3x5MlQ1ZAGC+nuZB+EYdgRZgiwxhTBTkF7CXvN"
        crossorigin="anonymous"></script>
</body>

</html>
